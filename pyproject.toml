[project]
name = "braindeadlm"
version = "0.1.0"
description = "BrainDeadLM - a language model built from absolute scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "numpy>=2.5.3",
    "torch>=2.14.1",
]

[project.scripts]
braindeadlm = "braindeadlm:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
